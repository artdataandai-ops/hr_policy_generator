server {
    listen 8080;
    server_name _;

    # Emit relative redirects so the bare-host redirect keeps the client's original
    # host:port (e.g. :7777) instead of nginx's internal :8080.
    absolute_redirect off;

    # Uploaded attachments (policy docs, résumés, RFPs, slide decks) can be large.
    # The backend caps requests at 40 MB total; allow a little headroom.
    client_max_body_size 50M;

    # --- API: strip /ai-agents and forward to the FastAPI backend ---
    # /ai-agents/api/<x>  ->  backend:8000/api/<x>
    location /ai-agents/api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The manager fans out to several Lyzr sub-agents; calls can be slow.
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- Health check (used by deploy scripts) — backend health lives at / ---
    location = /ai-agents/healthz {
        proxy_pass http://backend:8000/;
    }

    # --- Static SPA under /ai-agents/ ---
    # Deep links (/ai-agents/hr-policy, /ai-agents/it-helpdesk, …) fall back to
    # index.html so the client router can resolve the slug. The /ai-agents/api/
    # block above is more specific, so it always wins over this catch-all.
    location /ai-agents/ {
        alias /usr/share/nginx/html/ai-agents/;
        try_files $uri $uri/ /ai-agents/index.html;
    }

    # Convenience redirect so the bare host lands on the app.
    location = / {
        return 302 /ai-agents/;
    }
}
